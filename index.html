<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Living Innovation</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        .section {
            width: 100%;
            padding: 70px 0 100px;
        }

        .title {
            text-align: center;
            padding: 0 20px;
        }

        .title h1 {
            font-size: clamp(36px, 6vw, 64px);
            font-weight: 500;
            letter-spacing: -2px;
            margin-bottom: 16px;
        }

        .title p {
            color: #aaa;
            font-size: 16px;
            line-height: 1.6;
        }

        .gallery {
            width: 100%;
            overflow: hidden;
            margin-top: 55px;
        }

        .track {
            display: flex;
            width: max-content;
            gap: 18px;
            animation: scroll 35s linear infinite;
        }

        .gallery:hover .track {
            animation-play-state: paused;
        }

        .photo {
            width: 260px;
            height: 320px;
            object-fit: cover;
            flex-shrink: 0;
            display: block;
            border-radius: 2px;
            filter: brightness(0.9);
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .photo:hover {
            transform: scale(1.03);
            filter: brightness(1);
        }

        @keyframes scroll {

            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }

        }

        .bottom-text {
            max-width: 700px;
            margin: 65px auto 0;
            padding: 0 25px;
            text-align: center;
            color: #777;
            font-size: 14px;
            line-height: 1.8;
        }

        @media (max-width: 600px) {

            .section {
                padding: 50px 0 70px;
            }

            .gallery {
                margin-top: 40px;
            }

            .track {
                gap: 12px;
                animation-duration: 28s;
            }

            .photo {
                width: 190px;
                height: 240px;
            }

            .bottom-text {
                margin-top: 45px;
            }

        }

    </style>

</head>


<body>

    <section class="section">

        <div class="title">

            <h1>Living Innovation</h1>

            <p>
                Bringing art and creativity into everyday life.
            </p >

        </div>


        <div class="gallery">

            <div id="photoTrack" class="track"></div>

        </div>


        <div class="bottom-text">

            A visual exploration of how creativity,
            photography and design can become part of
            everyday life.

        </div>

    </section>


    <script>

        const photos = [
            "living-1.jpg",
            "living-2.jpg",
            "living-3.jpg",
            "living-4.jpg",
            "living-5.jpg",
            "living-6.jpg",
            "living-7.jpg",
            "living-8.jpg",
            "living-9.jpg",
            "living-10.jpg",
            "living-11.jpg",
            "living-12.jpg",
            "living-13.jpg"
        ];


        const track = document.getElementById("photoTrack");


        function createPhotos() {

            const allPhotos = [...photos, ...photos];


            allPhotos.forEach(function(fileName) {

                const image = document.createElement("img");

                image.src = fileName;

                image.alt = "Living Innovation";

                image.className = "photo";

                track.appendChild(image);

            });

        }


        createPhotos();

    </script>

</body>

</html>
